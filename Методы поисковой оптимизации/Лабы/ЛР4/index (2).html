<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алгоритм роя частиц: функция Растригина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="generation-counter">
    Итерация: <span id="iter-count">0</span>
</div>

<div id="controls" class="panel">

    <div class="param-group">
        <h4>Функция Растригина</h4>
        <div class="param-row">
            <span>f(x,y) = 20 + (x² - 10·cos(2πx)) + (y² - 10·cos(2πy))</span>
        </div>
        <div class="param-row">
            <span>Глобальный минимум: (0, 0)</span>
        </div>
    </div>

    <div class="param-group">
        <h4>Параметры PSO</h4>

        <div class="param-row">
            <label>Размер роя:</label>
            <input type="number" id="swarm-size" value="80">
        </div>

        <div class="param-row">
            <label>Число итераций:</label>
            <input type="number" id="max-iter" value="200">
        </div>

        <div class="param-row">
            <label>Инерция (ω):</label>
            <input type="number" id="inertia" value="0.729" step="0.01">
        </div>

        <div class="param-row">
            <label>Когнитивный (c1):</label>
            <input type="number" id="c1" value="1.494" step="0.1">
        </div>

        <div class="param-row">
            <label>Социальный (c2):</label>
            <input type="number" id="c2" value="1.494" step="0.1">
        </div>
        
        <div class="param-row">
            <label>Скорость (мс):</label>
            <input type="number" id="animation-delay" value="100" step="50" min="0">
        </div>
    </div>

    <button id="start-btn">Запустить</button>
    <button id="reset-btn" style="margin-top: 8px; background: #555;">Сброс</button>

</div>

<div id="info" class="panel">
    <h4>Результаты</h4>

    <div class="info-row">
        <span>X:</span>
        <span id="best-x">---</span>
    </div>

    <div class="info-row">
        <span>Y:</span>
        <span id="best-y">---</span>
    </div>

    <div class="info-row">
        <span>f(x,y):</span>
        <span id="best-f">---</span>
    </div>
</div>

<div id="chart-container" class="panel">
    <canvas id="chart"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
