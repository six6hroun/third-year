<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генетический алгоритм: функция Розенброка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="generation-counter">
    Поколение: <span id="gen-count">0</span>
</div>

<div id="controls" class="panel">

    <div class="param-group">
        <h4>Функция Розенброка</h4>
        <div class="param-row">
            <span>f(x,y) = (1-x)² + 100(y-x²)²</span>
        </div>
        <div class="param-row">
            <span>Глобальный минимум: (1, 1)</span>
        </div>
    </div>

    <div class="param-group">
        <h4>Параметры ГА</h4>

        <div class="param-row">
            <label>Размер популяции:</label>
            <input type="number" id="pop-size" value="50">
        </div>

        <div class="param-row">
            <label>Число поколений:</label>
            <input type="number" id="max-gen" value="100">
        </div>

        <div class="param-row">
            <label>Pc:</label>
            <input type="number" id="pc" value="0.8" step="0.1">
        </div>

        <div class="param-row">
            <label>Pm:</label>
            <input type="number" id="pm" value="0.05" step="0.01">
        </div>

        <div class="param-row">
            <label>Элита:</label>
            <input type="number" id="elite" value="2">
        </div>
    </div>

    <button id="start-btn">Запустить</button>

</div>

<div id="info" class="panel">
    <h4>Результаты</h4>

    <div class="info-row">
        <span>X:</span>
        <span id="best-x">---</span>
    </div>

    <div class="info-row">
        <span>Y:</span>
        <span id="best-y">---</span>
    </div>

    <div class="info-row">
        <span>f(x,y):</span>
        <span id="best-f">---</span>
    </div>

</div>

<div id="chart-container" class="panel">
    <canvas id="chart"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
