<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пчелиный алгоритм: оптимизация тестовых функций</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="generation-counter">
    Итерация: <span id="iter-count">0</span>
</div>

<div id="controls" class="panel">

    <div class="param-group">
        <h4>Выбор функции</h4>
        <div class="param-row">
            <select id="function-select" style="width:100%; padding:5px;">
                <option value="rastrigin">Функция Растригина</option>
                <option value="rosenbrock">Функция Розенброка</option>
                <option value="himmelblau">Функция Химмельблау</option>
            </select>
        </div>
    </div>

    <div class="param-group">
        <h4>Параметры пчелиного алгоритма</h4>

        <div class="param-row">
            <label>Пчел-разведчиков:</label>
            <input type="number" id="scouts-count" value="16">
        </div>

        <div class="param-row">
            <label>Элитных участков:</label>
            <input type="number" id="elite-sites" value="2">
        </div>

        <div class="param-row">
            <label>Перспективных участков:</label>
            <input type="number" id="good-sites" value="3">
        </div>

        <div class="param-row">
            <label>Пчел на элитный участок:</label>
            <input type="number" id="bees-elite" value="7">
        </div>

        <div class="param-row">
            <label>Пчел на перспективный:</label>
            <input type="number" id="bees-good" value="4">
        </div>

        <div class="param-row">
            <label>Радиус поиска (r):</label>
            <input type="number" id="search-radius" value="0.2" step="0.05">
        </div>

        <div class="param-row">
            <label>Число итераций:</label>
            <input type="number" id="max-iter" value="200">
        </div>
    </div>

    <button id="start-btn">Запустить</button>
    <button id="reset-btn" style="margin-top: 8px; background: #555;">Сброс</button>

</div>

<div id="info" class="panel">
    <h4>Результаты</h4>

    <div class="info-row">
        <span>X:</span>
        <span id="best-x">---</span>
    </div>

    <div class="info-row">
        <span>Y:</span>
        <span id="best-y">---</span>
    </div>

    <div class="info-row">
        <span>f(x,y):</span>
        <span id="best-f">---</span>
    </div>
</div>

<div id="chart-container" class="panel">
    <canvas id="chart"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
